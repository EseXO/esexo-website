<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EseXO Admin — Releases</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('esexo_admin_theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:0.75rem">
          <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
          <h1 class="font-display topbar-title">Releases</h1>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle theme">◐</button>
          <span class="topbar-user" id="admin-username"></span>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add">+ Add Release</button>
        </div>
      </header>
      <main class="content">
        <div class="toolbar">
          <input class="form-input" id="search" placeholder="Search…"  />
          <select class="form-select" id="filter-status" >
            <option value="">All statuses</option>
            <option value="UPCOMING">Upcoming</option>
            <option value="RELEASED">Released</option>
            <option value="ARCHIVED">Archived</option>
          </select>
        </div>
        <div id="list" class="table-wrap"><div class="empty-state">Loading…</div></div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-panel wide">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
        <h2 class="font-display" id="modal-title" style="margin:0;font-size:1.15rem">Add Release</h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="Close">✕</button>
      </div>
      <form id="release-form">
        <input type="hidden" id="edit-slug" value="" />
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label">Artwork</label>
            <input type="file" id="artwork" accept="image/*" class="form-input" />
            <img id="art-preview" class="preview-art" style="margin-top:0.75rem;display:none" alt="" />
          </div>
          <div>
            <label class="form-label">Title *</label>
            <input class="form-input" id="title" required />
            <label class="form-label" style="margin-top:0.75rem">Slug</label>
            <input class="form-input" id="slug" placeholder="auto from title" />
            <label class="form-label" style="margin-top:0.75rem">Artist</label>
            <input class="form-input" id="artist" value="EseXO" />
          </div>
        </div>
        <div class="grid sm:grid-cols-3 gap-4" style="margin-top:1rem">
          <div>
            <label class="form-label">Type</label>
            <select class="form-select" id="release_type">
              <option value="SINGLE">Single</option>
              <option value="EP">EP</option>
              <option value="ALBUM">Album</option>
            </select>
          </div>
          <div>
            <label class="form-label">Status</label>
            <select class="form-select" id="status">
              <option value="UPCOMING">Upcoming</option>
              <option value="RELEASED">Released</option>
              <option value="ARCHIVED">Archived</option>
            </select>
          </div>
          <div>
            <label class="form-label">Release date</label>
            <input class="form-input" type="date" id="release_date" />
          </div>
        </div>
        <div class="grid sm:grid-cols-2 gap-4" style="margin-top:1rem">
          <div>
            <label class="form-label">Spotify URL</label>
            <input class="form-input" id="spotify_url" type="url" placeholder="https://…" />
          </div>
          <div>
            <label class="form-label">Apple Music URL</label>
            <input class="form-input" id="apple_music_url" type="url" placeholder="https://…" />
          </div>
          <div>
            <label class="form-label">Audiomack URL</label>
            <input class="form-input" id="audiomack_url" type="url" placeholder="https://…" />
          </div>
          <div>
            <label class="form-label">OneRPM / Pre-save URL</label>
            <input class="form-input" id="onerpm_url" type="url" placeholder="https://…" />
          </div>
        </div>
        <div style="margin-top:1rem">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="description"></textarea>
        </div>
        <label style="display:flex;align-items:center;gap:0.5rem;margin-top:1rem;font-size:0.9rem;cursor:pointer">
          <input type="checkbox" id="featured" /> Featured
        </label>
        <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.5rem">
          <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save Release</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirm -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-panel" style="max-width:400px">
      <h2 class="font-display" style="margin:0 0 0.75rem;font-size:1.1rem">Delete release?</h2>
      <p id="delete-msg" style="color:var(--text-muted);font-size:0.9rem;margin:0 0 1.25rem"></p>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end">
        <button type="button" class="btn btn-ghost" id="delete-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/releases.js"></script>
</body>
</html>
